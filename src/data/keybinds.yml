classes:
  warrior:
    name: Protection Warrior
    slug: protection-warrior
    display_name: Warrior
    abilities:
      "1":
        name: Impending Victory
        keybind: "1"
        wowhead_id: 202168
        icon: https://render.worldofwarcraft.com/us/icons/56/589768.jpg
        tooltip: "Instantly attack the target, causing 20 damage and healing you for 30%
          of your maximum health.\r

          \r

          Killing an enemy that yields experience or honor resets the cooldown
          of Impending Victory and makes it cost no Rage."
        cached_name: Impending Victory
      "2":
        name: Ignore Pain
        keybind: "2"
        wowhead_id: 190456
        icon: https://render.worldofwarcraft.com/us/icons/56/1377132.jpg
        tooltip: Fight through the pain, ignoring 50% of damage taken for 12 sec sec or
          until 564 damage has been prevented.
        cached_name: Ignore Pain
      "3":
        name: Shield Block
        keybind: "3"
        wowhead_id: 2565
        icon: https://render.worldofwarcraft.com/us/icons/56/132110.jpg
        tooltip: Raise your shield, blocking all melee attacks against you for 6 sec.
        cached_name: Shield Block
      "4":
        name: Spell Reflection
        keybind: "4"
        wowhead_id: 23920
        icon: https://render.worldofwarcraft.com/us/icons/56/132361.jpg
        tooltip: Raise your weapon, reflecting the first spell cast on you and reducing
          magic damage you take by 20% for 5 sec.
        cached_name: Spell Reflection
      "5":
        name: Shield Charge
        keybind: "5"
        wowhead_id: 385952
        icon: https://render.worldofwarcraft.com/us/icons/56/4667427.jpg
        tooltip: "Charge to an enemy with your shield, granting you Shield Block and
          dealing 296 Physical damage to it and 93 Physical damage to all
          enemies within 10 yards.\r

          \r

          Also stuns the primary target for 4 sec.\r

          \r

          Generates 20 Rage."
        cached_name: Shield Charge
      "6":
        name: Demoralizing Shout
        keybind: "6"
        wowhead_id: 1160
        icon: https://render.worldofwarcraft.com/us/icons/56/132366.jpg
        tooltip: Demoralizes all enemies within 10 yards, reducing the damage they deal
          to you by 20% for 8 sec.
        cached_name: Demoralizing Shout
      q:
        name: Shield Slam
        keybind: Q
        wowhead_id: 23922
        icon: https://render.worldofwarcraft.com/us/icons/56/134951.jpg
        tooltip: "Slams the target with your shield, causing 81 Physical damage.\r

          \r

          Generates 15 Rage."
        cached_name: Shield Slam
      e:
        name: Revenge
        keybind: E
        wowhead_id: 6572
        icon: https://render.worldofwarcraft.com/us/icons/56/132353.jpg
        tooltip: "Swing in a wide arc, dealing 97 Physical damage to all enemies in
          front of you. Deals reduced damage beyond 5 targets.\r

          \r

          Your successful dodges, parries, and auto-attacks have a chance to
          make your next Revenge cost no Rage."
        cached_name: Revenge
      r:
        name: Thunder Clap
        keybind: R
        wowhead_id: 6343
        icon: https://render.worldofwarcraft.com/us/icons/56/136105.jpg
        tooltip: Blasts all enemies within 8 yards for 82 Physical damage and reduces
          their movement speed by 20% for 10 sec. Deals reduced damage beyond 5
          targets.
        cached_name: Thunder Clap
      f:
        name: Avatar
        keybind: F
        wowhead_id: 107574
        icon: https://render.worldofwarcraft.com/us/icons/56/613534.jpg
        tooltip: Transform into a colossus, increasing all damage you deal by 20% and
          reducing damage you take from area of effect attacks by 5% for 20 sec.
        cached_name: Avatar
      z:
        name: Last Stand
        keybind: Z
        wowhead_id: 12975
        icon: https://render.worldofwarcraft.com/us/icons/56/135871.jpg
        tooltip: Increases maximum health by 30% for 8 sec and instantly heals you for
          that amount.
        cached_name: Last Stand
      c:
        name: Shield Wall
        keybind: C
        wowhead_id: 871
        icon: https://render.worldofwarcraft.com/us/icons/56/132362.jpg
        tooltip: Reduces all damage you take by 40% for 8 sec.
        cached_name: Shield Wall
      v:
        name: Rallying Cry
        keybind: V
        wowhead_id: 97462
        icon: https://render.worldofwarcraft.com/us/icons/56/132351.jpg
        tooltip: "Lets loose a rallying cry, granting all party or raid members within
          40 yards 10% temporary and maximum health for 10 sec.\r

          \r

          Health granted increased by 50% when not in a raid."
        cached_name: Rallying Cry
      x:
        name: Ravager
        keybind: X
        wowhead_id: 228920
        icon: https://render.worldofwarcraft.com/us/icons/56/970854.jpg
        tooltip: "Throws a whirling weapon at your target that chases nearby enemies,
          inflicting 371 Physical damage to all enemies over 12 sec. Deals
          reduced damage beyond 8 targets.\r

          \r

          Enemies damaged by Ravager take 50% additional damage from your Bleeds
          for 12 sec."
        cached_name: Ravager
      mouse4:
        name: Pummel
        keybind: M4
        wowhead_id: 6552
        icon: https://render.worldofwarcraft.com/us/icons/56/132938.jpg
        tooltip: Pummels the target, interrupting spellcasting and preventing any spell
          in that school from being cast for 5 sec.
        cached_name: Pummel
      mouse5:
        name: Taunt
        keybind: M5
        wowhead_id: 355
        icon: https://render.worldofwarcraft.com/us/icons/56/136080.jpg
        tooltip: Taunts the target to attack you, and increases the threat you generate
          against them by 800% for 6 sec.
        cached_name: Taunt
      g:
        name: Charge
        keybind: G
        wowhead_id: 100
        icon: https://render.worldofwarcraft.com/us/icons/56/132337.jpg
        tooltip: "Charge to an enemy, dealing 7 Physical damage, rooting it for 1 sec.\r

          \r

          Generates 20 Rage."
        cached_name: Charge
      h:
        name: Battlelord's Bloodthirsty War Wyrm
        keybind: H
        wowhead_id: 229388
        icon: https://render.worldofwarcraft.com/us/icons/56/inv_warriormount.jpg
        tooltip: Summons and dismisses your Battlelord's Bloodthirsty War Wyrm. This is
          a flying mount.
        cached_name: Battlelord's Bloodthirsty War Wyrm
